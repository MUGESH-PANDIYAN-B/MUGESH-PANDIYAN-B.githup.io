<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mugesh Pandiyan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            background-image:url("high-resolution-yellow-background-hd-wallpapers-for-download_xuP-1644216639.jpg"); background-repeat:no-repeat; background-size:cover;
            color: #333;
            display: flex;
            justify-content:center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contact-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .contact-card h1 {
            margin: 0 0 5px;
            color: #2c3e50;
        }
        .contact-card p.title {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .contact-info {
            text-align: left;
            margin-bottom: 25px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .contact-info p {
            margin: 12px 0;
            font-size: 0.95em;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .social-links a {
            text-decoration: none;
            color: #3498db;
            font-weight: 600;
            transition: color 0.3s;
        }
        .social-links a:hover {
            color: #2980b9;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="contact-card">
